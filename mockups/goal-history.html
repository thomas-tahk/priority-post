<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>priority-post — goal history mockup</title>
<style>
  :root {
    --bg: #fafaf8; --surface: #ffffff; --surface-2: #f4f3ee;
    --border: #e7e5e0; --border-strong: #d8d6d0;
    --text: #1a1a1a; --text-dim: #6b6963; --text-faint: #a8a59c;
    --accent: #1a1a1a; --ok: #16a34a;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
    --shadow-lg: 0 4px 14px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
    --cat-work:#2563eb; --cat-personal:#9333ea; --cat-health:#16a34a;
    --cat-learning:#ea580c; --cat-errands:#0891b2; --cat-side_project:#db2777; --cat-other:#64748b;
    --rail-w: 220px; --panel-w: 380px;
  }
  [data-theme="dark"] {
    --bg:#0f0f11; --surface:#1a1a1d; --surface-2:#16161a;
    --border:#2a2a30; --border-strong:#3a3a42;
    --text:#f0efe9; --text-dim:#a3a299; --text-faint:#6b6963; --accent:#f0efe9; --ok:#22c55e;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 8px rgba(0,0,0,0.3);
    --shadow-lg: 0 6px 18px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.3);
    --cat-work:#3b82f6; --cat-personal:#a855f7; --cat-health:#22c55e;
    --cat-learning:#f97316; --cat-errands:#06b6d4; --cat-side_project:#ec4899; --cat-other:#94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 20px;
    border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:10; }
  h1 { margin:0; font-size:15px; font-weight:600; }
  h1 .dim { color:var(--text-faint); font-weight:400; font-size:11px; margin-left:6px; }
  .spacer { flex:1; }
  .seg { display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px; }
  .seg button { border:none; background:transparent; color:var(--text-dim); padding:5px 10px; border-radius:6px; font:inherit; font-size:12px; cursor:pointer; }
  .seg button.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow); font-weight:500; }
  .seg-label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:600; }
  .btn { background:var(--surface); color:var(--text); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font:inherit; font-size:12px; font-weight:500; cursor:pointer; }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--text-dim); }
  .btn.primary { background:var(--text); color:var(--bg); border-color:var(--text); }

  main { display:grid; grid-template-columns:var(--rail-w) 1fr; min-height:calc(100vh - 55px); }
  .rail { border-right:1px solid var(--border); background:var(--surface-2); padding:14px 10px; }
  .rail-label { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); margin:6px 8px; font-weight:600; }
  .rail-item { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:7px; color:var(--text-dim); font-size:13px; }
  .rail-item.active { background:var(--surface); color:var(--text); font-weight:500; box-shadow:var(--shadow); }
  .rail-item .dot { width:9px; height:9px; border-radius:50%; }
  .rail-item .name { flex:1; }
  .rail-item .count { font-size:11px; color:var(--text-faint); }

  .pane { padding:22px 28px 80px; max-width:1100px; }
  .ctx-head h2 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.015em; }
  .ctx-head .meta { font-size:12px; color:var(--text-faint); margin-top:4px; }
  .goal-desc { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 15px; margin:14px 0 18px; font-size:13px; color:var(--text-dim); }
  .section-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:14px 0 10px 2px; font-weight:600; display:flex; align-items:baseline; gap:8px; }
  .section-label .aside { text-transform:none; letter-spacing:0; font-weight:400; }

  /* task rows */
  .task { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin-bottom:8px; cursor:pointer; }
  .task:hover { box-shadow:var(--shadow); }
  .title-row { display:flex; align-items:flex-start; gap:10px; }
  .checkbox { width:18px; height:18px; border:1.5px solid var(--text-faint); border-radius:5px; flex-shrink:0; margin-top:1px; }
  .task .title { font-size:14px; font-weight:500; flex:1; }
  .row-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; margin-left:28px; }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background:var(--bg); font-size:11px; border:1px solid var(--border); color:var(--text-dim); }
  .pill.cat { color:#fff; border:none; font-weight:500; }

  /* done rows — closed, but readable and clickable */
  .done-row { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .done-row:hover { background:var(--surface); border-color:var(--border); }
  .done-row .tick { width:16px; height:16px; border-radius:50%; background:var(--ok); color:#fff; font-size:10px; display:grid; place-items:center; flex-shrink:0; }
  .done-row .title { flex:1; color:var(--text-dim); font-size:13px; }
  .done-row .cdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .done-row .when { font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .done-row .has-notes { font-size:11px; color:var(--text-faint); }

  .week { margin-bottom:14px; }
  .week-head { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-dim); font-weight:600; padding:4px 2px 6px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .week-head .n { color:var(--text-faint); font-weight:400; }
  .week-head .meter { margin-left:auto; display:flex; gap:3px; }
  .week-head .meter i { width:8px; height:8px; border-radius:2px; background:var(--border); display:block; }
  .week-head .meter i.on { background:var(--goal); }
  .week-head .met { font-size:11px; color:var(--ok); font-weight:500; }
  .show-older { background:transparent; border:1px dashed var(--border-strong); color:var(--text-dim); border-radius:8px; padding:7px 12px; font:inherit; font-size:12px; cursor:pointer; width:100%; }

  /* trend strip */
  .trend { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px 10px; margin:6px 0 16px; }
  .trend-top { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .trend-top .big { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .trend-top .sub { font-size:12px; color:var(--text-faint); }
  .trend-top .gate { margin-left:auto; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); }
  .bars { position:relative; display:grid; grid-template-columns:repeat(12, 1fr); gap:6px; align-items:end; height:64px; }
  .bar { background:var(--goal); opacity:.35; border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .bar.hit { opacity:1; }
  .bar.now { outline:1.5px dashed var(--goal); outline-offset:2px; }
  .bar:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); font-size:11px; padding:3px 7px; border-radius:5px; white-space:nowrap; z-index:5; }
  .target-line { position:absolute; left:0; right:0; border-top:1.5px dashed var(--border-strong); pointer-events:none; }
  .target-line span { position:absolute; right:0; top:-16px; font-size:10px; color:var(--text-faint); }
  .bar-labels { display:grid; grid-template-columns:repeat(12, 1fr); gap:6px; margin-top:5px; font-size:10px; color:var(--text-faint); text-align:center; }

  /* variant C: two columns */
  .cols { display:grid; grid-template-columns: 1.15fr 1fr; gap:24px; align-items:start; }
  .cols .history-col { background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; position:sticky; top:70px; max-height:calc(100vh - 90px); overflow:auto; }
  .spark { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; align-items:end; height:28px; margin:2px 0 12px; }
  .spark .bar:hover::after { display:none; }

  /* variant B: timeline */
  .timeline { position:relative; padding-left:22px; }
  .timeline::before { content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--border); }
  .tl-week { position:relative; margin-bottom:16px; }
  .tl-week::before { content:""; position:absolute; left:-21px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--goal); }
  .tl-week.hit::before { background:var(--goal); }
  .tl-week.empty::before { border-color:var(--border-strong); }
  .tl-week .week-head { border-bottom:none; padding-bottom:2px; }
  .tl-empty { font-size:12px; color:var(--text-faint); font-style:italic; padding:0 2px; }

  /* detail panel — closed state */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.18); display:none; z-index:39; }
  .scrim.open { display:block; }
  .panel { position:fixed; top:0; right:0; height:100vh; width:var(--panel-w); max-width:100vw; background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); padding:18px 22px 40px; overflow-y:auto; transform:translateX(100%); transition:transform .18s; z-index:40; }
  .panel.open { transform:none; }
  .closed-banner { display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--ok) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--ok) 35%, var(--border)); border-radius:10px; padding:10px 12px; margin:26px 0 14px; }
  .closed-banner .tick { width:20px; height:20px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:12px; }
  .closed-banner .txt { flex:1; font-size:13px; }
  .closed-banner .txt b { display:block; }
  .closed-banner .txt span { color:var(--text-dim); font-size:12px; }
  .panel .x { position:absolute; top:12px; right:12px; border:none; background:transparent; font-size:20px; color:var(--text-faint); cursor:pointer; }
  .ptitle { font-size:18px; font-weight:600; margin:0 0 12px; color:var(--text-dim); }
  .ro-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .ro-field label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:600; margin-bottom:2px; }
  .ro-field div { font-size:13px; color:var(--text-dim); }
  .ro-field .lock { font-size:10px; margin-left:4px; opacity:.6; }
  .field-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600; margin:18px 0 6px; display:flex; gap:6px; align-items:baseline; }
  .field-label .aside { text-transform:none; letter-spacing:0; font-weight:400; }
  .notes { border:1px solid var(--border-strong); border-radius:8px; min-height:140px; padding:10px 12px; font-size:13px; background:var(--bg); outline:none; }
  .notes:focus { border-color:var(--accent); }

  .note { margin-top:30px; font-size:12px; color:var(--text-faint); border-top:1px dashed var(--border-strong); padding-top:10px; }

  @media (max-width: 760px) {
    main { grid-template-columns:1fr; } .rail { display:none; }
    .pane { padding:16px; } .cols { grid-template-columns:1fr; }
    .cols .history-col { position:static; max-height:none; }
  }
</style>
</head>
<body>
<header>
  <h1>priority-post <span class="dim">goal history mockup</span></h1>
  <div class="spacer"></div>
  <span class="seg-label">Variant</span>
  <div class="seg" id="variantSeg">
    <button data-v="A" class="active">A · stacked</button>
    <button data-v="B">B · timeline</button>
    <button data-v="C">C · side-by-side</button>
  </div>
  <span class="seg-label">Goal kind</span>
  <div class="seg" id="kindSeg">
    <button data-k="track" class="active">track + weekly</button>
    <button data-k="gate">gate</button>
    <button data-k="plain">plain</button>
  </div>
  <button class="btn ghost" id="themeBtn">🌙</button>
</header>

<main>
  <aside class="rail">
    <div class="rail-label">Goals</div>
    <div class="rail-item active"><span class="dot" style="background:var(--cat-work)"></span><span class="name">Job search</span><span class="count">4</span></div>
    <div class="rail-item"><span class="dot" style="background:var(--cat-health)"></span><span class="name">Half marathon</span><span class="count">3</span></div>
    <div class="rail-item"><span class="dot" style="background:var(--cat-side_project)"></span><span class="name">priority-post</span><span class="count">6</span></div>
  </aside>
  <section class="pane" id="pane"></section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>

<script>
const GOAL = { name: "Job search", color: "var(--cat-work)", target: 5, targetDate: "Nov 14", daysLeft: 36 };
const NOW = new Date(2026, 9, 9); // Fri Oct 9 2026
const DAY = 86400000;

const OPEN = [
  { t: "Tailor resume for Datadog SRE role", cats: ["work"], meta: ["urgency 82", "45 min"] },
  { t: "Follow up with Priya re: referral", cats: ["work","personal"], meta: ["urgency 70", "10 min"] },
  { t: "Mock system-design interview", cats: ["learning"], meta: ["importance 75", "90 min"] },
  { t: "Update LinkedIn headline", cats: ["work"], meta: ["15 min"] },
];

// deterministic fake history: weeks ago -> titles
const TITLES = ["Apply: Stripe infra","Apply: Vercel platform","Apply: Neon DX","Coffee chat w/ Sam","Apply: Linear","Rewrite cover letter template","Apply: Fly.io","Leetcode: graphs set","Apply: Render","Recruiter screen — Cloudflare","Apply: Supabase","Thank-you note to panel","Apply: PlanetScale","Portfolio: add priority-post case study","Apply: Railway","Apply: Retool","Prep STAR stories","Apply: Tailscale","Apply: Temporal","Apply: Grafana"];
const PER_WEEK = [3, 5, 6, 2, 4, 5, 0, 3, 5, 1, 2, 4]; // index 0 = this week
const CAT = ["work","work","learning","personal"];
let k = 0;
const DONE = [];
PER_WEEK.forEach((n, w) => {
  for (let i = 0; i < n; i++) {
    const dayOffset = w === 0 ? (i % 5) : (i * 1.3) % 7;
    const doneAt = new Date(NOW - w * 7 * DAY - dayOffset * DAY);
    const openDays = 1 + ((k * 7) % 11);
    DONE.push({ id: k, t: TITLES[k % TITLES.length], cat: CAT[k % 4], week: w, doneAt,
      created: new Date(doneAt - openDays * DAY), openDays, notes: k % 3 === 0 });
    k++;
  }
});

let variant = "A", kind = "track", showOlder = false;
const fmt = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const wkStart = (w) => { const d = new Date(NOW - w * 7 * DAY); const back = (d.getDay() + 6) % 7; return new Date(d - back * DAY); };
const weekName = (w) => w === 0 ? "This week" : w === 1 ? "Last week" : `${fmt(wkStart(w))} – ${fmt(new Date(+wkStart(w) + 6 * DAY))}`;
const hasTarget = () => kind === "track";

function openTaskHtml() {
  return OPEN.map((o) => `
    <div class="task"><div class="title-row"><div class="checkbox"></div><div class="title">${o.t}</div></div>
    <div class="row-meta">${o.cats.map((c) => `<span class="pill cat" style="background:var(--cat-${c})">${c}</span>`).join("")}
    ${o.meta.map((m) => `<span class="pill">${m}</span>`).join("")}</div></div>`).join("");
}

function doneRowHtml(d) {
  return `<div class="done-row" onclick="openClosed(${d.id})">
    <span class="tick">✓</span><span class="cdot" style="background:var(--cat-${d.cat})"></span>
    <span class="title">${d.t}</span>${d.notes ? `<span class="has-notes" title="has notes">✎</span>` : ""}
    <span class="when">${fmt(d.doneAt)}</span></div>`;
}

function meterHtml(n) {
  if (!hasTarget()) return "";
  if (n >= GOAL.target) return `<span class="met">✓ target met</span>`;
  return `<span class="meter">${Array.from({ length: GOAL.target }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
}

function trendHtml(compact) {
  const max = Math.max(...PER_WEEK, hasTarget() ? GOAL.target : 0);
  const order = [...PER_WEEK.keys()].reverse(); // oldest -> newest
  const bars = order.map((w) => {
    const n = PER_WEEK[w];
    const hit = hasTarget() ? n >= GOAL.target : true;
    return `<div class="bar ${hit ? "hit" : ""} ${w === 0 ? "now" : ""}" style="height:${(n / max) * 100}%" data-tip="${weekName(w)}: ${n}"></div>`;
  }).join("");
  if (compact) return `<div class="spark">${bars}</div>`;
  const total = PER_WEEK.reduce((a, b) => a + b, 0);
  const hits = PER_WEEK.filter((n) => n >= GOAL.target).length;
  const line = hasTarget() ? `<div class="target-line" style="bottom:${(GOAL.target / max) * 100}%"><span>target ${GOAL.target}/wk</span></div>` : "";
  const sub = hasTarget() ? `done in 12 weeks · target hit ${hits} of 12 weeks` : `done in 12 weeks · avg ${(total / 12).toFixed(1)}/wk`;
  const gate = kind === "gate" ? `<span class="gate">${GOAL.daysLeft} days left · due ${GOAL.targetDate}</span>` : "";
  const labels = order.map((w) => `<span>${w === 0 ? "now" : w % 4 === 0 ? fmt(wkStart(w)) : ""}</span>`).join("");
  return `<div class="trend"><div class="trend-top"><span class="big">${total}</span><span class="sub">${sub}</span>${gate}</div>
    <div class="bars">${line}${bars}</div><div class="bar-labels">${labels}</div></div>`;
}

function weeksToShow() {
  const all = [...PER_WEEK.keys()];
  return showOlder ? all : all.slice(0, 4);
}

function groupedHtml() {
  const weeks = weeksToShow().filter((w) => PER_WEEK[w] > 0);
  const body = weeks.map((w) => `<div class="week"><div class="week-head">${weekName(w)} <span class="n">· ${PER_WEEK[w]}</span>${meterHtml(PER_WEEK[w])}</div>
    ${DONE.filter((d) => d.week === w).map(doneRowHtml).join("")}</div>`).join("");
  return body + olderBtn();
}

function timelineHtml() {
  const body = weeksToShow().map((w) => {
    const n = PER_WEEK[w];
    const cls = n === 0 ? "empty" : (!hasTarget() || n >= GOAL.target) ? "hit" : "";
    const rows = n === 0 ? `<div class="tl-empty">nothing closed this week</div>` : DONE.filter((d) => d.week === w).map(doneRowHtml).join("");
    return `<div class="tl-week ${cls}"><div class="week-head">${weekName(w)} <span class="n">· ${n}</span>${meterHtml(n)}</div>${rows}</div>`;
  }).join("");
  return `<div class="timeline">${body}</div>` + olderBtn();
}

function olderBtn() {
  const hidden = PER_WEEK.slice(4).reduce((a, b) => a + b, 0);
  return `<button class="show-older" onclick="toggleOlder()">${showOlder ? "show fewer" : `show older · ${hidden} more`}</button>`;
}

function headHtml() {
  const doneN = DONE.length;
  const meta = kind === "gate" ? `due ${GOAL.targetDate} · ${GOAL.daysLeft} days left` : kind === "track" ? `${GOAL.target}/week` : "no target";
  return `<div class="ctx-head"><h2>${GOAL.name}</h2><div class="meta">${OPEN.length + doneN} tasks · ${doneN} done · ${meta} · started Jul 14</div></div>
    <div class="goal-desc">Land a platform/SRE role. Five applications a week, every week.</div>`;
}

function render() {
  const pane = document.getElementById("pane");
  pane.style.setProperty("--goal", GOAL.color);
  const active = `<p class="section-label">${OPEN.length} open <span class="aside">· ranked</span></p>${openTaskHtml()}`;
  const doneLabel = `<p class="section-label" style="margin-top:28px">history <span class="aside">· ${DONE.length} closed</span></p>`;
  let body = "";
  if (variant === "A") body = active + doneLabel + trendHtml(false) + groupedHtml();
  if (variant === "B") body = active + doneLabel + trendHtml(false) + timelineHtml();
  if (variant === "C") body = `<div class="cols"><div>${active}</div><div class="history-col">
      <p class="section-label" style="margin-top:0">history <span class="aside">· ${DONE.length} closed · 12 wk</span></p>
      ${trendHtml(true)}${groupedHtml()}</div></div>`;
  pane.innerHTML = headHtml() + body +
    `<div class="note">A: trend card + week-grouped list. B: same card + vertical timeline (empty weeks shown — gaps are data). C: active and history side by side; trend shrinks to a sparkline. Click any closed row → closed-state detail panel.</div>`;
}

function toggleOlder() { showOlder = !showOlder; render(); }

function openClosed(id) {
  const d = DONE.find((x) => x.id === id);
  const lock = `<span class="lock" title="read-only — reopen to edit">🔒</span>`;
  document.getElementById("panel").innerHTML = `
    <button class="x" onclick="closePanel()">×</button>
    <div class="closed-banner"><span class="tick">✓</span>
      <div class="txt"><b>Closed ${fmt(d.doneAt)}</b><span>open ${d.openDays}d · created ${fmt(d.created)}</span></div>
      <button class="btn" onclick="closePanel()">Reopen</button></div>
    <div class="ptitle">${d.t}</div>
    <div class="ro-grid">
      <div class="ro-field"><label>Goal${lock}</label><div>● ${GOAL.name}</div></div>
      <div class="ro-field"><label>Category${lock}</label><div><span class="pill cat" style="background:var(--cat-${d.cat})">${d.cat}</span></div></div>
      <div class="ro-field"><label>Urgency${lock}</label><div>64</div></div>
      <div class="ro-field"><label>Importance${lock}</label><div>71</div></div>
      <div class="ro-field"><label>Est. time${lock}</label><div>30 min</div></div>
      <div class="ro-field"><label>Focus${lock}</label><div>medium</div></div>
    </div>
    <div class="field-label">Notes <span class="aside">· still editable — add what happened</span></div>
    <div class="notes" contenteditable="true">${d.notes ? "Applied via referral portal. Recruiter replied in 2 days — screen booked." : ""}</div>`;
  document.getElementById("panel").classList.add("open");
  document.getElementById("scrim").classList.add("open");
}
function closePanel() { document.getElementById("panel").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
document.getElementById("scrim").onclick = closePanel;

function wireSeg(id, attr, set) {
  document.getElementById(id).addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    [...e.currentTarget.children].forEach((x) => x.classList.toggle("active", x === b));
    set(b.dataset[attr]); render();
  });
}
wireSeg("variantSeg", "v", (v) => (variant = v));
wireSeg("kindSeg", "k", (k) => (kind = k));
document.getElementById("themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
render();
</script>
</body>
</html>
